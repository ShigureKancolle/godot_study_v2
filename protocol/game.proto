syntax = "proto3";

// 本仓库唯一可编辑的 Protobuf 协议源。
// 修改后运行 tools/sync_proto.ps1，禁止手工修改生成代码。
package game;

message CombatEntityInfo {
  string entity_id = 1;
  float atk_facing = 2;
}

message EntityInfo {
  string entity_id = 1;
  string player_name = 2;
  uint64 entity_type = 3;
  float x = 4;
  float y = 5;
  float facing_x = 6;
  float facing_y = 7;
  string anim_state = 8;
  bool moving = 9;
  string ai_state = 10;
  CombatEntityInfo combat_entity_info = 11;
}


// 客户端 -> 服务端
message LoginRequest {
  string account = 1;
  string player_name = 2;
}

// 服务端 -> 客户端
message LoginAccepted {
  string account = 1;
  string player_name = 2;
}

// 客户端 -> 服务端
message EnterGameRequest {
  string room_id = 1;
  bool create_room = 2;
  string player_name = 3;
}

// 服务端 -> 客户端
message WorldSnapshot {
  string room_id = 1;
  repeated EntityInfo entities = 2;
  int64 server_tick = 3;
  string self_entity_id = 4;
  string map_id = 5;
}

// 客户端 -> 服务端。服务端必须从已认证连接推导受控实体；
// entity_id 仅为迁移阶段临时保留。
message MoveIntent {
  string entity_id = 1;
  float dir_x = 2;
  float dir_y = 3;
  bool moving = 4;
}

// 客户端 -> 服务端  请求转向
message AtkRotateIntent {
  string entity_id = 1;
  float atk_facing = 2;
}

// s->c
message AtkRotateEntry {
  string entity_id = 1;
  float atk_facing = 2;
}

message AtkRotateFrame {
  int64 server_tick = 1;
  repeated AtkRotateEntry entries = 2;
}


message AttackIntent {
  string attacker_id = 1;
  int32 attack_id = 2;
}

// 服务端 -> 客户端
message MovementEntry {
  string entity_id = 1;
  float x = 2;
  float y = 3;
  float speed = 4;
  bool moving = 5;
  string anim_state = 6;
  float facing_x = 7;
  float facing_y = 8;
}

// 服务端 -> 客户端
message MovementFrame {
  uint64 server_tick = 1;
  repeated MovementEntry entries = 2;
}

message CombatFrame {
  uint64 server_tick = 1;
  repeated CombatEntityInfo combats = 2;
}

// 服务端 -> 客户端
message EntityRemoved {
  string entity_id = 1;
}

// 服务端 -> 客户端
message EntityRelocated {
  string entity_id = 1;
  float facing = 2;
}

// 服务端 -> 客户端
message EntitySpawned {
  string entity_id = 1;
  EntityInfo entity_info = 2;
}

message AttackStart {
  string attacker_id = 1;
  int32 attack_id = 2;
  float atk_facing = 3;  // 相对于(1,0)方向的弧度 在负派到派
}

message AttackHit {
  string attacker_id = 1;
  int32 attack_id = 2;
}

message EntityHurt {
  string hurt_entity_id = 1;
  int32 attack_id = 2;
}

// 服务端 -> 客户端。说明客户端命令被拒绝的原因；
// 这是单次请求的响应，不属于权威世界状态。
message CommandRejected {
  string command_name = 1;
  string reason_code = 2;
  string reason_message = 3;
}

// 该包络只允许承载客户端发往服务端的消息。
message ClientMessage {
  oneof payload {
    LoginRequest login_request = 1;
    EnterGameRequest enter_game_request = 2;
    MoveIntent move_intent = 3;
    AttackIntent attack_intent = 4;
    AtkRotateIntent atk_rotate_intent = 5;
  }
}

// 该包络只允许承载服务端发往客户端的消息。
message ServerMessage {
  string run_id = 1;
  uint64 server_tick = 2;

  oneof payload {
    LoginAccepted login_accepted = 3;
    WorldSnapshot world_snapshot = 4;
    MovementFrame movement_frame = 5;
    EntitySpawned entity_spawned = 6;
    EntityRemoved entity_removed = 7;
    EntityRelocated entity_relocated = 8;
    CommandRejected command_rejected = 9;
    AttackStart attack_start = 10;
    AttackHit attack_hit = 11;
    EntityHurt entity_hurt = 12;
    CombatFrame combat_frame = 13;
  }
}
