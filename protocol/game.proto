syntax = "proto3";

// 本仓库唯一可编辑的 Protobuf 协议源。
// 修改后运行 tools/sync_proto.ps1，禁止手工修改生成代码。
package game;

message CombatEntityInfo {
  string entity_id = 1;
  float atk_facing = 2;
  int32 hp = 3;
  int32 max_hp = 4;
  bool dead = 5;
}

message EntityInfo {
  string entity_id = 1;
  string player_name = 2;
  uint64 entity_type = 3;
  float x = 4;
  float y = 5;
  float facing_x = 6;
  float facing_y = 7;
  string anim_state = 8;
  bool moving = 9;
  string ai_state = 10;
  CombatEntityInfo combat_entity_info = 11;
}


// 客户端 -> 服务端
message LoginRequest {
  string account = 1;
  string player_name = 2;
}

// 服务端 -> 客户端
message LoginAccepted {
  string account = 1;
  string player_name = 2;
}

// 客户端 -> 服务端
message EnterGameRequest {
  string room_id = 1;
  bool create_room = 2;
  string player_name = 3;
}

// 服务端 -> 客户端
message WorldSnapshot {
  string room_id = 1;
  repeated EntityInfo entities = 2;
  int64 server_tick = 3;
  string self_entity_id = 4;
  string map_id = 5;
}

// 客户端 -> 服务端。服务端必须从已认证连接推导受控实体；
// entity_id 仅为迁移阶段临时保留。
message MoveIntent {
  string entity_id = 1;
  float dir_x = 2;
  float dir_y = 3;
  bool moving = 4;
}

// 客户端 -> 服务端  请求转向
message AtkRotateIntent {
  string entity_id = 1;
  float atk_facing = 2;
}

message AttackIntent {
  string attacker_id = 1;
  int32 attack_id = 2;
}

// 服务端 -> 客户端
message MovementEntry {
  string entity_id = 1;
  float x = 2;
  float y = 3;
  float speed = 4;
  bool moving = 5;
  string anim_state = 6;
  float facing_x = 7;
  float facing_y = 8;
}

// 瞄准朝向增量
message AimStateDelta {
  string entity_id = 1;
  float atk_facing = 2;
}

// hp变化增量
message HealthStateDelta {
  string entity_id = 1;
  int32 hp = 2;
  int32 max_hp = 3;
  bool dead = 4;
}

// 之后追加 mp 能量条  cd  。。。。更多的战斗状态

// 离散的世界事件
message DamageEvent {
  string attacker_id = 1;
  string target_id = 2;
  int32 attack_id = 3;
  int32 damage = 4;
  bool critical = 5; // 是否为暴击
}

message AttackStart {
  string attacker_id = 1;
  int32 attack_id = 2;
  float atk_facing = 3;  // 相对于(1,0)方向的弧度 在负派到派
}

message AttackHit {
  string attacker_id = 1;
  int32 attack_id = 2;
  repeated string hit_entity_ids = 3;
}

message EntityDead {
  string entity_id = 1;
}

// 服务端 -> 客户端。说明客户端命令被拒绝的原因；
// 这是单次请求的响应，不属于权威世界状态。
message CommandRejected {
  string command_name = 1;
  string reason_code = 2;
  string reason_message = 3;
}

// 离散的世界事件
message WorldEvent {
  uint64 event_id = 1;

  oneof payload {
    AttackStart attack_start = 2;
    AttackHit attack_hit = 3;
    DamageEvent damage = 4;
    EntityDead entity_dead = 5;
  }
}

// 世界帧消息
message WorldFrame {
  // 合批处理的事件
  repeated EntityInfo spawned_entities = 1; // 这帧生成的实体
  repeated string removed_entity_ids = 2;  // 这帧消除的实体
  
  repeated MovementEntry movements = 3; // 这帧移动的实体
  repeated AimStateDelta aims = 4; // 瞄准朝向变化
  repeated HealthStateDelta health_states = 5; // 血量变化

  repeated WorldEvent events = 6; // 单独处理的事件
}

// 该包络只允许承载客户端发往服务端的消息。
message ClientMessage {
  oneof payload {
    LoginRequest login_request = 1;
    EnterGameRequest enter_game_request = 2;
    MoveIntent move_intent = 3;
    AttackIntent attack_intent = 4;
    AtkRotateIntent atk_rotate_intent = 5;
  }
}

// 该包络只允许承载服务端发往客户端的消息。
message ServerMessage {
  string run_id = 1;
  uint64 server_tick = 2;

  // 5、6、7、8、10、11、12、13 已由 WorldFrame 替代，禁止复用这些字段号。

  oneof payload {
    LoginAccepted login_accepted = 3;
    WorldSnapshot world_snapshot = 4;
    CommandRejected command_rejected = 9;
    WorldFrame world_frame = 14;
  }
}
