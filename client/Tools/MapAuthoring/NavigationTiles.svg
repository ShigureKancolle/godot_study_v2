<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 32 16" shape-rendering="crispEdges">
  <!-- 左侧 16×16：草地。色块保持像素风，作为逻辑地图的可通行地形。 -->
  <rect x="0" y="0" width="16" height="16" fill="#4f9b58"/>
  <rect x="1" y="2" width="2" height="1" fill="#69b968"/>
  <rect x="8" y="1" width="1" height="2" fill="#3f844d"/>
  <rect x="12" y="5" width="2" height="1" fill="#75c36f"/>
  <rect x="4" y="8" width="1" height="2" fill="#397746"/>
  <rect x="9" y="11" width="2" height="1" fill="#70b967"/>
  <rect x="14" y="14" width="1" height="1" fill="#397746"/>
  <!-- 右侧 16×16：水。深浅横纹让边界和池塘在编辑器里容易辨认。 -->
  <rect x="16" y="0" width="16" height="16" fill="#2f83bd"/>
  <rect x="16" y="2" width="9" height="2" fill="#55b7d9"/>
  <rect x="28" y="2" width="4" height="2" fill="#55b7d9"/>
  <rect x="20" y="7" width="10" height="2" fill="#246ca8"/>
  <rect x="16" y="12" width="6" height="2" fill="#54add1"/>
  <rect x="25" y="12" width="7" height="2" fill="#54add1"/>
</svg>
